<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze</title>
  <link rel="stylesheet" href="./src/ui/styles.css" />
</head>

<body>
  <div id="stage">
    <div id="viewport">
      <canvas id="game" width="640" height="480"></canvas>
      <div id="loading" role="status">Loading...</div>
      <div id="completion" hidden>
        <div class="completion-card">
          <p class="completion-title">You escaped the maze</p>
          <button id="restart" type="button">Play again</button>
        </div>
      </div>
    </div>
    <aside id="stats"></aside>
  </div>
  <div id="hint">Arrows / WASD — move · Space — attack · E — consume corpse</div>
  <label id="controls"><input type="checkbox" id="debug" /> debug grid &amp; coords</label>
  <div id="version">version: <span id="ver">—</span></div>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
